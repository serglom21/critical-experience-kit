- id: wallet_onboarding
  name: Create or import a wallet
  source: discovered:code
  confidence: high
  notes: 'Explored from metamask. Establishes the vault that holds the user''s keys; failure here blocks
    a new user entirely. Corroborated by: e2e, analytics. Grounded steps: 100%.'
  steps:
  - id: set_password
    evidence: "User sets a password and accepts terms \u2014 ui/pages/onboarding-flow/create-password/create-password.tsx:368\
      \ handleCreatePassword; ui/pages/onboarding-flow/create-password/create-password.tsx:256 handleCreateNewWallet"
    surface: browser
  - id: create_vault
    evidence: "New vault and recovery phrase created (social path syncs to the seedless service) \u2014\
      \ ui/pages/onboarding-flow/onboarding-flow.tsx:257 handleCreateNewAccount; ui/store/actions.ts:1196\
      \ createNewVaultAndGetSeedPhrase"
    surface: browser
  - id: restore_vault
    evidence: "Import path restores a vault from a recovery phrase \u2014 ui/pages/onboarding-flow/onboarding-flow.tsx:360\
      \ createNewVaultAndRestore; ui/store/actions.ts:1149 createNewVaultAndRestore"
    surface: browser
  - id: complete_onboarding
    evidence: "Onboarding marked complete \u2014 ui/pages/onboarding-flow/onboarding-flow.tsx:328 setCompletedOnboarding;\
      \ ui/pages/onboarding-flow/onboarding-flow.tsx:343 completeOnboarding"
    surface: browser
  needs_clarification:
  - "business_impact is unset \u2014 a human must assign it. Nothing in source says which flow earns revenue."
  - "Step order and boundaries were proposed by reading code, not observed at runtime \u2014 confirm."
  - 'Open question from explorer: Recovery phrase confirmation and metrics-consent steps were not traced'
  - 'Open question from explorer: Seedless/social login path only partly read'
  - "Outcome values were proposed by the explorer \u2014 confirm them and set success_values."
  correlation_key:
    attribute: onboarding.flow_id
  outcome:
    attribute: onboarding.outcome
    values:
    - completed
    - abandoned
    - failed
  actor_segment:
  - attribute: first_time_flow_type
