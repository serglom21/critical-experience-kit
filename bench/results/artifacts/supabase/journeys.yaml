journeys:
- id: sign_up_and_sign_in
  name: Sign up and sign in
  source: discovered:code
  confidence: high
  notes: 'Explored from supabase. Nobody reaches the product without it; MFA and redirect failures lock
    users out. Corroborated by: analytics. Grounded steps: 100%.'
  steps:
  - id: sign_up_submit
    evidence: "User submits email and password to create an account \u2014 apps/studio/components/interfaces/SignIn/SignUpForm.tsx:80\
      \ onSubmit; apps/studio/components/interfaces/SignIn/SignUpForm.tsx:66 useSignUpMutation"
    surface: browser
  - id: password_sign_in
    evidence: "Credentials are verified against auth \u2014 apps/studio/components/interfaces/SignIn/SignInForm.tsx:80\
      \ signInWithPassword"
    surface: browser
  - id: mfa_challenge
    evidence: "Accounts with MFA are redirected to the second-factor form \u2014 apps/studio/components/interfaces/SignIn/SignInForm.tsx:93\
      \ buildPathWithParams; apps/studio/components/interfaces/SignIn/SignInMfaForm.tsx"
    surface: browser
  - id: redirect_into_app
    evidence: "Session established, user routed to their destination \u2014 apps/studio/components/interfaces/SignIn/SignInForm.tsx:109\
      \ router"
    surface: browser
  needs_clarification:
  - "business_impact is unset \u2014 a human must assign it. Nothing in source says which flow earns revenue."
  - "Step order and boundaries were proposed by reading code, not observed at runtime \u2014 confirm."
  - 'Open question from explorer: SSO and OAuth variants (SignInSSOForm, SignInWithExternalProvider) were
    not traced'
  - "Outcome values were proposed by the explorer \u2014 confirm them and set success_values."
  correlation_key:
    attribute: auth.attempt_id
  outcome:
    attribute: auth.outcome
    values:
    - signed_in
    - mfa_required
    - failed
  actor_segment:
  - attribute: auth.method
